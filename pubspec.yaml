name: flutter_skeleton
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: '>=3.4.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.0.0
  firebase_core: ^4.4.0
  shared_preferences: ^2.2.3
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  equatable: ^2.0.5
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1
  flutter_spinkit: ^5.2.1
  floor: ^1.5.0
  intl: ^0.20.2
  firebase_analytics: ^12.1.1
  device_info_plus: ^12.3.0
  lottie: ^3.1.2
  go_router: ^17.1.0
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
    - assets/lang/
    - assets/
  fonts:
    - family: Schyler
      fonts:
        - asset: assets/fonts/mulish/Mulish-Light.ttf
          weight: 300
        - asset: assets/fonts/mulish/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/mulish/Mulish-Medium.ttf
          weight: 500
        - asset: assets/fonts/mulish/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/mulish/Mulish-Bold.ttf
          weight: 700
